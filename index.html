<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{CLAN_TITLE}}</title>
  <meta name="theme-color" content="#070b12" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <link rel="stylesheet" href="/dist/styles.css?v=20260513c" />
  <script defer src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script defer src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base:    #070b12;
      --bg-surface: #0c1220;
      --bg-card:    #111827;
      --bg-raised:  #172032;
      --border:     #1c2d42;
      --border-subtle: #162030;
      --text-1: #f0f4f8;
      --text-2: #b4c5d6;
      --text-3: #8298b0;
      --accent: #3b82f6;
      --accent-glow: rgba(59,130,246,.18);
      --gold:   #f59e0b;
      --silver: #94a3b8;
      --bronze: #b45309;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg-base);
      color: var(--text-1);
      font-size: 14px;
      line-height: 1.5;
    }
    html, body { overflow-x: hidden; width: 100%; max-width: 100vw; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #1e3048; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #2a4060; }
    .lb-scroll::-webkit-scrollbar { height: 10px; }
    .lb-scroll::-webkit-scrollbar-track { background: var(--bg-raised); border-radius: 99px; }
    .lb-scroll::-webkit-scrollbar-thumb { background: #2a4060; border-radius: 99px; }
    .lb-scroll::-webkit-scrollbar-thumb:hover { background: #3a5880; }

    /* Sidebar nav */
    .nav-item { display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;cursor:pointer;color:var(--text-2);font-size:13.5px;font-weight:500;transition:all .15s; }
    .nav-item:hover { background:rgba(255,255,255,.06);color:var(--text-1); }
    .nav-item.active { background:linear-gradient(90deg,rgba(59,130,246,.18),rgba(59,130,246,.06));color:#60a5fa;border-left:2px solid #3b82f6;margin-left:-2px; }
    .nav-section { font-size:10px;font-weight:700;color:#6b8299;text-transform:uppercase;letter-spacing:.1em;padding:18px 12px 6px; }

    /* Cards */
    .stat-card { background:var(--bg-card);border-radius:14px;padding:20px 22px;border:1px solid var(--border);transition:border-color .2s; }
    .stat-card:hover { border-color:#243347; }

    /* Spinner */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spin { animation: spin 1s linear infinite; }

    /* Table */
    .tbl th { font-size:11px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em;padding:8px 12px;border-bottom:1px solid var(--border); }
    .tbl td { padding:10px 12px;border-bottom:1px solid var(--border-subtle); }
    .tbl tr:last-child td { border-bottom:none; }
    .tbl tr:hover td { background:var(--bg-raised); }

    /* Badges */
    .badge { display:inline-flex;align-items:center;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600; }
    .badge-blue  { background:#0a1e3d;color:#60a5fa;border:1px solid #1e3a6e; }
    .badge-green { background:#052e16;color:#4ade80;border:1px solid #14532d; }

    /* Mobile bottom nav */
    @media (max-width: 768px) {
      .sidebar { display:none !important; }
      .mobile-nav { display:flex !important; }
      .main-pad { padding-left:0 !important; margin-left:0 !important; padding-bottom:72px !important; }
      .hero-title { font-size:28px !important; }
      .hero-pad   { padding:0 16px !important; }
      .hero-wrap  { height:220px !important; }
      .mvp-card   { padding:14px 14px !important; flex-wrap:wrap !important; gap:10px !important; }
      .mvp-card > div:last-child { display:flex; flex-wrap:wrap; gap:12px; }
      .stat-grid  { gap:8px !important; grid-template-columns:repeat(2,1fr) !important; }
      .stat-card  { padding:14px 14px !important; }
      .stat-val   { font-size:20px !important; }
      .best-game-row { flex-direction:column !important; }
      .best-game-row > div { min-width:100% !important; }
      .tbl th, .tbl td { padding:6px 6px !important; font-size:11px !important; }
      .match-stats-row { gap:8px !important; }
      .match-stats-row > div { min-width:0 !important; }
      .player-stat-grid { grid-template-columns:repeat(3,1fr) !important; gap:6px !important; }
      .modal { margin:8px !important; max-width:100% !important; }
      .lb-header { padding:0 !important; }
      /* Sticky header mobile adjustments */
      .main-pad > div:first-child { padding:12px 16px !important; }
      /* Player cards single column on mobile */
      .p-6 .grid.md\\:grid-cols-2 { grid-template-columns:1fr !important; }
      .p-6 { padding:16px !important; }
      /* Settings max-width override */
      .max-w-lg { max-width:100% !important; }
    }
    @media (min-width: 769px) {
      .mobile-nav { display:none !important; }
    }

    /* Pulse animation for loading skeleton */
    @keyframes pulse { 0%,100%{opacity:.4} 50%{opacity:.8} }
    .skeleton { background:var(--bg-raised);border-radius:6px;animation:pulse 1.5s ease-in-out infinite; }

    /* Ambient background canvas */
    #bg-canvas { position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none; }
    #root { position:relative;z-index:1; }
    .boot-loading {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
    }
    .boot-loading__card {
      width: min(480px, 100%);
      background: linear-gradient(180deg, rgba(12,18,32,.96), rgba(17,24,39,.92));
      border: 1px solid var(--border);
      border-radius: 22px;
      box-shadow: 0 24px 80px rgba(0,0,0,.45);
      padding: 28px 24px;
      text-align: center;
    }
    .boot-loading__spinner {
      width: 44px;
      height: 44px;
      margin: 0 auto 18px;
      border-radius: 999px;
      border: 3px solid rgba(96,165,250,.22);
      border-top-color: #60a5fa;
      animation: spin 1s linear infinite;
    }
    .boot-loading__eyebrow {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .18em;
      color: #60a5fa;
      margin-bottom: 8px;
    }
    .boot-loading__title {
      margin: 0;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -.03em;
      line-height: 1.05;
      color: var(--text-1);
    }
    .boot-loading__body {
      margin: 10px 0 0;
      font-size: 14px;
      line-height: 1.6;
      color: var(--text-2);
    }

    /* Icon sizing — defined here so it never depends on Tailwind purge */
    .app-icon    { width:16px;height:16px;flex-shrink:0;display:block; }
    .app-icon-sm { width:14px;height:14px; }

    /* Stat card clickable hover */
    .players-grid { display:grid; gap:1rem; grid-template-columns:1fr; }
    @media (min-width:768px) { .players-grid { grid-template-columns:repeat(2,minmax(0,1fr)); } }
    @media (min-width:1024px) { .players-grid { grid-template-columns:repeat(3,minmax(0,1fr)); } }
    .stat-card-click { cursor:pointer; }
    .stat-card-click:hover { border-color:var(--accent) !important; transform:translateY(-1px); box-shadow:0 4px 24px rgba(59,130,246,.12); }
    .stat-card-click:active { transform:translateY(0); }

    /* Modal */
    .modal-bg { position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(3px); }
    .modal { background:var(--bg-card);border-radius:18px;max-width:560px;width:100%;max-height:85vh;overflow:auto;box-shadow:0 32px 80px rgba(0,0,0,.6);border:1px solid var(--border); }

    /* Abbreviation tooltips */
    [data-tip] { position:relative; cursor:help; border-bottom:1px dashed rgba(148,163,184,.35); text-decoration:none; }
    [data-tip]::after {
      content: attr(data-tip);
      position: absolute;
      bottom: calc(100% + 6px);
      left: 50%;
      transform: translateX(-50%);
      background: #1a2a3d;
      color: #c8d8e8;
      font-size: 11px;
      font-weight: 500;
      line-height: 1.35;
      white-space: nowrap;
      padding: 5px 9px;
      border-radius: 6px;
      border: 1px solid #243347;
      pointer-events: none;
      opacity: 0;
      transition: opacity .15s ease, transform .15s ease;
      transform: translateX(-50%) translateY(3px);
      z-index: 9999;
      box-shadow: 0 4px 12px rgba(0,0,0,.5);
    }
    [data-tip]:hover::after {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
<canvas id="bg-canvas" aria-hidden="true"></canvas>
<script>
(function(){
  var canvas = document.getElementById('bg-canvas');
  var ctx = canvas.getContext('2d');
  var W, H;
  function resize(){ W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
  resize();
  window.addEventListener('resize', resize);
  var orbs = [
    { cx:0.05, cy:0.05, r:480, rgb:[59,130,246],  sx:0.12, sy:0.09, sp:0.00022, ph:0.0 },
    { cx:0.85, cy:0.35, r:380, rgb:[16,185,129],   sx:0.10, sy:0.13, sp:0.00015, ph:2.1 },
    { cx:0.20, cy:0.85, r:320, rgb:[99,102,241],   sx:0.11, sy:0.08, sp:0.00012, ph:4.2 },
    { cx:0.55, cy:0.55, r:260, rgb:[245,158,11],   sx:0.07, sy:0.10, sp:0.00028, ph:1.0 },
  ];
  function draw(ts){
    ctx.clearRect(0,0,W,H);
    for(var i=0;i<orbs.length;i++){
      var o=orbs[i];
      var x=(o.cx + Math.sin(ts*o.sp + o.ph)*o.sx)*W;
      var y=(o.cy + Math.cos(ts*o.sp*0.73 + o.ph)*o.sy)*H;
      var g=ctx.createRadialGradient(x,y,0,x,y,o.r);
      var c=o.rgb.join(',');
      g.addColorStop(0,  'rgba('+c+',0.14)');
      g.addColorStop(0.45,'rgba('+c+',0.05)');
      g.addColorStop(1,  'rgba('+c+',0)');
      ctx.beginPath(); ctx.arc(x,y,o.r,0,Math.PI*2);
      ctx.fillStyle=g; ctx.fill();
    }
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();
</script>
<div id="root">
  <div class="boot-loading" role="status" aria-live="polite">
    <div class="boot-loading__card">
      <div class="boot-loading__spinner" aria-hidden="true"></div>
      <div class="boot-loading__eyebrow">{{CLAN_NAME}}</div>
      <h1 class="boot-loading__title">{{CLAN_BOOT_TITLE}}</h1>
      <p class="boot-loading__body">{{CLAN_BOOT_BODY}}</p>
    </div>
  </div>
</div>

<script defer src="/dist/bundle.js?v=20260517a"></script>
<script>
if ('serviceWorker' in navigator) {
  // Clear stale SW caches so code changes take effect immediately
  navigator.serviceWorker.getRegistrations().then(regs => {
    regs.forEach(r => r.unregister());
  });
  caches.keys().then(keys => keys.forEach(k => caches.delete(k)));
}
</script>
</body>
</html>
